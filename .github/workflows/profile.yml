name: profile

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch Geist and Simple Icons
        run: |
          mkdir -p /tmp/deps && cd /tmp/deps
          npm pack geist@1.7.2 simple-icons@16.34.0
          mkdir geist si && tar xzf geist-*.tgz -C geist && tar xzf simple-icons-*.tgz -C si
      - name: Build README
        env:
          # classic PAT with `repo` + `read:user`; GITHUB_TOKEN can't see private repos
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/build_svgs.py /tmp/deps/geist/package/dist/fonts /tmp/deps/si/package/icons assets README.md
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A assets README.md
          if git commit -m "chore: refresh profile stats"; then git push; else echo "no changes"; fi
